name: iOS release validation

on:
  push:
    branches:
      - release/folego-v1
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folego-v1-ios-release
  cancel-in-progress: true

jobs:
  ios-release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Generate native scaffolds
        run: |
          chmod +x scripts/bootstrap_flutter.sh
          ./scripts/bootstrap_flutter.sh

      - name: Build iOS release without signing
        run: flutter build ios --no-codesign --release
