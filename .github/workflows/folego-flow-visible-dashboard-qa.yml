name: Folego Flow visible dashboard QA

on:
  push:
    branches:
      - design/folego-flow-home-usable-20261106
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/folego-flow-visible-dashboard-qa.yml'
  pull_request:
    branches:
      - release/folego-flow-20261106
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-visible-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze
      - name: Home budget navigation responsive privacy tests
        run: flutter test test/web2_responsive_shell_test.dart test/home_mobile_summary_strip_test.dart test/aurora_active_iphone_home_test.dart test/folego4_home_visual_test.dart test/home_budget_overview_panel_test.dart test/shell_navigation_motion_test.dart test/flow_native_navigation_test.dart -r expanded
      - name: Build PWA
        run: flutter build web --release
