name: Release candidate validation

on:
  push:
    branches:
      - release/folego-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folego-v1-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Premium entitlement tests
        run: flutter test test/subscription_access_test.dart -r expanded

      - name: Projection regression
        run: flutter test test/projection_screen_test.dart -r expanded --concurrency=1

      - name: Recurring schedule regression
        run: flutter test test/recurring_month_end_regression_test.dart -r expanded

      - name: Notification and automation entitlement regression
        run: flutter test test/notification_automation_foundation_test.dart -r expanded

      - name: Build web
        run: flutter build web --release

      - name: Generate native scaffolds
        run: bash scripts/bootstrap_flutter.sh

      - name: Compile Android debug APK
        run: flutter build apk --debug

      - name: Legacy full-suite snapshot
        continue-on-error: true
        run: flutter test -r expanded
