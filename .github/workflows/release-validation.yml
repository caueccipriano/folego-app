name: Release candidate validation

on:
  push:
    branches:
      - release/folego-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test -r expanded

      - name: Build web
        run: flutter build web --release

      - name: Generate native scaffolds
        run: bash scripts/bootstrap_flutter.sh

      - name: Compile Android debug APK
        run: flutter build apk --debug
