name: CSV date ambiguity release safety

on:
  pull_request:
    paths:
      - 'folego_flutter/lib/features/transactions/statement_import_parser.dart'
      - 'folego_flutter/lib/features/transactions/statement_import_screen.dart'
      - 'folego_flutter/test/csv_ambiguous_date_test.dart'
      - '.github/workflows/csv-date-ambiguity.yml'
      - 'docs/CARD_CSV_SIGN_CONVENTIONS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-date-format:
    name: Ambiguous month/day formats refuse staging until explicit choice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: folego_flutter
        run: flutter pub get
      - name: Analyze date parser, wizard and full Flutter app
        working-directory: folego_flutter
        run: |
          dart analyze \
            lib/features/transactions/statement_import_parser.dart \
            lib/features/transactions/statement_import_screen.dart \
            test/csv_ambiguous_date_test.dart
          flutter analyze --no-pub
      - name: Synthetic day/month ambiguity and prior statement regressions
        working-directory: folego_flutter
        run: |
          flutter test \
            test/csv_ambiguous_date_test.dart \
            test/csv_card_sign_convention_test.dart \
            test/csv_card_sign_ui_test.dart \
            test/portable_csv_header_mapping_test.dart \
            test/statement_import_parser_test.dart \
            test/statement_import_qa_synthetic_test.dart \
            test/statement_import_ui_test.dart \
            test/statement_import_contract_test.dart
      - name: Declare actual limits
        run: |
          {
            echo 'Synthetic data only. Fails auto-format if day/month ambiguous.'
            echo 'Actual third-party CSV files and signed-session RLS staging'
            echo 'have not been validated. No live records or payments changed.'
          } >> "$GITHUB_STEP_SUMMARY"
