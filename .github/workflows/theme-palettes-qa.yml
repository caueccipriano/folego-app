name: QA visual - temas
on:
  push:
    branches:
      - feat/theme-palettes-20261015
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/theme-palettes-qa.yml'
  pull_request:
    branches:
      - feat/transactions-recurring
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/theme-palettes-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: test visual tokens
        run: flutter test test/theme_palette_test.dart test/theme_preference_test.dart
      - name: build web (sem deploy)
        run: flutter build web --release --base-href "/folego-app/"
