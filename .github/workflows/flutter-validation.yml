name: Flutter validation

on:
  push:
    branches:
      - feat/transactions-recurring
  pull_request:
    branches:
      - feat/transactions-recurring
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Home data freshness safety regression
        run: flutter test test/home_data_freshness_test.dart test/home_load_guard_test.dart test/sheet_sync_status_test.dart test/financial_organization_space_isolation_test.dart test/transaction_pending_guard_test.dart test/classification_review_overview_test.dart test/sheet_reconciliation_audit_test.dart

      - name: Flutter test
        run: |
          set +e
          flutter test test/projection_screen_test.dart test/premium_sandbox_screen_test.dart test/feature_entitlements_test.dart test/profile_settings_test.dart test/pwa_web_contract_test.dart -r expanded --concurrency=1 --fail-fast > /tmp/flutter-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tr '\r' '\n' < /tmp/flutter-test.log > /tmp/flutter-test-normalized.log
            awk 'BEGIN {printing=0; count=0} /EXCEPTION CAUGHT/ {printing=1} printing {print; count++} count>=220 {exit}' /tmp/flutter-test-normalized.log
            tail -n 30 /tmp/flutter-test-normalized.log
            exit "$code"
          fi
          echo "Projection tests passed"

      - name: Flutter build web
        env:
          FOLEGO_ASAAS_SANDBOX_UI: ${{ github.head_ref == 'feat/asaas-web-sandbox-20261014' && 'true' || 'false' }}
        run: flutter build web --release --dart-define=FOLEGO_ASAAS_SANDBOX_UI="$FOLEGO_ASAAS_SANDBOX_UI"

      - name: Prepare isolated sandbox hosting artifact
        if: github.head_ref == 'feat/asaas-web-sandbox-20261014'
        run: python ../ops/hosting/prepare_cloudflare.py --build build/web --version "$GITHUB_SHA"

      - name: Upload sandbox PWA candidate without deploying
        if: github.head_ref == 'feat/asaas-web-sandbox-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: folego-asaas-sandbox-pwa-${{ github.sha }}
          path: folego_flutter/build/web
          retention-days: 7
