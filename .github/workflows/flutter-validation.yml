name: Flutter validation

on:
  push:
    branches:
      - feat/transactions-recurring
  pull_request:
    branches:
      - feat/transactions-recurring
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Typography themes and notification contracts
        run: flutter test test/theme_palette_test.dart test/theme_preference_test.dart test/notification_models_test.dart test/notification_service_test.dart test/notification_runtime_test.dart test/notification_preferences_hardening_test.dart test/notification_history_account_isolation_test.dart

      - name: Discovery and isolated demo regression
        run: flutter test test/financial_evolution_test.dart test/discovery_test.dart test/statement_import_qa_mobile_stress_test.dart

      - name: Safe reconciliation and home priority
        run: flutter test test/reconciliation_home_priority_test.dart

      - name: Wallet commitment and spending clarity
        run: flutter test test/wallet_commitment_insights_test.dart

      - name: Smart category suggestions (quick register and classification)
        run: flutter test test/smart_category_suggestion_test.dart

      - name: Home data freshness safety regression
        run: flutter test test/home_data_freshness_test.dart test/home_load_guard_test.dart test/sheet_sync_status_test.dart test/financial_organization_space_isolation_test.dart test/transaction_pending_guard_test.dart test/classification_review_overview_test.dart test/sheet_reconciliation_audit_test.dart

      - name: Home and Wallet compact UX regressions
        run: flutter test test/home_monthly_money_wiring_test.dart test/home_monthly_cards_drilldown_test.dart test/home_financial_copy_test.dart test/wallet_qa_mobile_stress_test.dart

      - name: Admin dashboard synthetic UI and access-denied tests
        run: flutter test test/folego_admin_layout_test.dart

      - name: Purchase simulation and entry safety
        run: flutter test test/purchase_simulation_test.dart test/purchase_entry_wiring_test.dart

      - name: Agenda month view regression
        run: flutter test test/agenda_monthly_view_wiring_test.dart

      - name: Import mobile review safety
        run: flutter test test/statement_import_sticky_review_test.dart test/statement_import_ui_test.dart

      - name: Plan intelligence, category and approval safety
        run: flutter test test/plan_experience_test.dart test/plan_insights_section_test.dart test/plan_interaction_state_test.dart

      - name: Safe current month budget pacing
        run: flutter test test/budget_pace_context_test.dart

      - name: Monthly review read-only checklist regression
        run: flutter test test/monthly_close_review_test.dart

      - name: Help center regression
        run: flutter test test/folego_help_center_test.dart

      - name: Fixed and variable spending classification and privacy
        run: flutter test test/spending_behavior_test.dart test/expense_behavior_entrypoints_test.dart

      - name: Registered income and fixed expenses safety
        run: flutter test test/registered_spending_margin_safety_test.dart

      - name: Atomic spending behavior security contract
        run: flutter test test/atomic_behavior_contract_test.dart test/spending_behavior_test.dart

      - name: Flutter test
        run: |
          set +e
          flutter test test/projection_screen_test.dart -r expanded --concurrency=1 --fail-fast > /tmp/flutter-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tr '\r' '\n' < /tmp/flutter-test.log > /tmp/flutter-test-normalized.log
            awk 'BEGIN {printing=0; count=0} /EXCEPTION CAUGHT/ {printing=1} printing {print; count++} count>=220 {exit}' /tmp/flutter-test-normalized.log
            tail -n 30 /tmp/flutter-test-normalized.log
            exit "$code"
          fi
          echo "Projection tests passed"

      - name: Flutter build web
        run: flutter build web --release
