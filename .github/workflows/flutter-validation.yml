name: Flutter validation

on:
  push:
    branches:
      - feat/transactions-recurring
  pull_request:
    branches:
      - feat/transactions-recurring
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Home data freshness safety regression
        run: flutter test test/home_data_freshness_test.dart test/home_load_guard_test.dart test/sheet_sync_status_test.dart test/financial_organization_space_isolation_test.dart test/transaction_pending_guard_test.dart test/classification_review_overview_test.dart test/sheet_reconciliation_audit_test.dart

      - name: Fixed and variable spending classification and privacy
        run: flutter test test/spending_behavior_test.dart

      - name: Registered income and fixed expenses safety
        run: flutter test test/registered_income_fixed_margin_test.dart test/spending_behavior_test.dart

      - name: Flutter test
        run: |
          set +e
          flutter test test/projection_screen_test.dart -r expanded --concurrency=1 --fail-fast > /tmp/flutter-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tr '\r' '\n' < /tmp/flutter-test.log > /tmp/flutter-test-normalized.log
            awk 'BEGIN {printing=0; count=0} /EXCEPTION CAUGHT/ {printing=1} printing {print; count++} count>=220 {exit}' /tmp/flutter-test-normalized.log
            tail -n 30 /tmp/flutter-test-normalized.log
            exit "$code"
          fi
          echo "Projection tests passed"

      - name: Flutter build web
        run: flutter build web --release
