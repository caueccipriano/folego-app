name: Folego PWA preview artifact

on:
  pull_request:
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/pwa-preview-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify application
        run: |
          flutter analyze
          flutter test test/app_breakpoints_test.dart test/auth_widgets_test.dart test/auth_responsive_smoke_test.dart test/setup_checklist_test.dart test/help_faq_screen_test.dart
      - name: Build PWA preview
        run: flutter build web --release --base-href "/"
      - name: Stamp preview version
        run: |
          sed -i "s/__FOLEGO_CACHE_VERSION__/${GITHUB_SHA}/g" build/web/folego_push_sw.js
          sed -i "s/__FOLEGO_BUILD_VERSION__/${GITHUB_SHA}/g" build/web/index.html
          sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" build/web/flutter_bootstrap.js
      - name: Check preview files
        run: |
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/folego_push_sw.js
          ! grep -q '__FOLEGO_CACHE_VERSION__' build/web/folego_push_sw.js
          ! grep -q '__FOLEGO_BUILD_VERSION__' build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: folego-pwa-preview-${{ github.sha }}
          path: folego_flutter/build/web
          retention-days: 14
          if-no-files-found: error
      - name: Publish isolated static preview branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ai-cors-home-polish-20260929'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          static_dir="$(mktemp -d)"
          cp -a build/web/. "$static_dir/"
          cat > "$static_dir/vercel.json" <<'JSON'
          {"version":2,"framework":null,"buildCommand":null,"outputDirectory":".","rewrites":[{"source":"/(.*)","destination":"/index.html"}]}
          JSON
          printf '%s\n' "$GITHUB_SHA" > "$static_dir/source-sha.txt"
          cd "$static_dir"
          git init -q
          git config user.name "folego-preview-bot"
          git config user.email "folego-preview-bot@users.noreply.github.com"
          git add .
          git commit -qm "preview: built PWA from $GITHUB_SHA"
          git branch -M preview/folego-ai-polish-20260929
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/preview/folego-ai-polish-20260929
