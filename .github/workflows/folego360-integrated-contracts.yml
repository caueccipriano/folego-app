name: Folego 360 combined synthetic acceptance

on:
  pull_request:
    paths:
      - 'folego_flutter/lib/features/panorama/**'
      - 'folego_flutter/lib/features/home/home_screen_base.dart'
      - 'folego_flutter/lib/widgets/financial_ai_card.dart'
      - 'folego_flutter/lib/features/transactions/statement_import_*'
      - 'folego_flutter/lib/core/subscriptions/**'
      - 'folego_flutter/lib/features/premium/**'
      - 'folego_flutter/lib/core/notifications/**'
      - 'folego_flutter/web/folego_push_bridge.js'
      - 'folego_flutter/web/tests/folego_push_recovery_bridge.test.cjs'
      - 'folego_flutter/test/panorama_*'
      - 'folego_flutter/test/financial_ai_card_privacy_test.dart'
      - 'folego_flutter/test/csv_*'
      - 'folego_flutter/test/portable_*'
      - 'folego_flutter/test/premium_release_contract_test.dart'
      - 'folego_flutter/test/ios_push_gesture_contract_test.dart'
      - 'folego_flutter/test/push_recovery_screen_test.dart'
      - '.github/workflows/folego360-integrated-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-integration:
    name: Full static + all-user Flutter business and mobile UI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: folego_flutter
        run: flutter pub get
      - name: Analyze full Flutter source, including integrated Premium labels
        working-directory: folego_flutter
        run: flutter analyze --no-pub
      - name: Run core semantics, Panorama, imports, subscriptions and Push UI
        working-directory: folego_flutter
        run: |
          flutter test \
            test/financial_ai_card_privacy_test.dart \
            test/panorama_360_data_test.dart \
            test/panorama_360_screen_test.dart \
            test/panorama_budget_watch_test.dart \
            test/panorama_category_changes_test.dart \
            test/panorama_category_change_card_test.dart \
            test/panorama_month_comparison_test.dart \
            test/panorama_month_trend_test.dart \
            test/panorama_upcoming_navigation_test.dart \
            test/monthly_money_summary_test.dart \
            test/flexible_budget_model_test.dart \
            test/financial_goal_test.dart \
            test/portable_csv_header_mapping_test.dart \
            test/csv_card_sign_convention_test.dart \
            test/csv_card_sign_ui_test.dart \
            test/csv_ambiguous_date_test.dart \
            test/csv_ambiguous_date_ui_test.dart \
            test/csv_space_switch_privacy_test.dart \
            test/statement_import_contract_test.dart \
            test/statement_import_parser_test.dart \
            test/statement_import_qa_synthetic_test.dart \
            test/statement_import_ui_test.dart \
            test/premium_release_contract_test.dart \
            test/ios_push_gesture_contract_test.dart \
            test/push_recovery_screen_test.dart
      - name: Verify approved display price and deliberately unconfigured billing
        run: |
          grep -Fq 'R\$ 9,90/mês' folego_flutter/lib/core/subscriptions/subscription_service.dart
          grep -Fq 'R\$ 9.90/month' folego_flutter/lib/features/premium/premium_screen.dart
          grep -Fq 'Not configured or verified' docs/revenuecat-launch-checklist.md
          if grep -Fq 'R\$ 14,90/mês' folego_flutter/lib/core/subscriptions/subscription_service.dart; then
            echo 'FAIL: stale user-facing Premium price label.'
            exit 1
          fi

  push-browser-contract:
    name: Browser Push recovery and two-tap gesture synthetic unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject JS syntax errors
        run: |
          node --check folego_flutter/web/folego_push_bridge.js
          node --check folego_flutter/web/tests/folego_push_recovery_bridge.test.cjs
      - name: Test fictional owned-session Push recovery and browser gesture
        run: node --test folego_flutter/web/tests/folego_push_recovery_bridge.test.cjs

  honest-release-verdict:
    name: Green CI does not bypass authenticated staging or physical phones
    if: always()
    needs: [finance-integration, push-browser-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize release boundaries, fail if required jobs failed
        env:
          FINANCE_RESULT: ${{ needs.finance-integration.result }}
          PUSH_RESULT: ${{ needs.push-browser-contract.result }}
        run: |
          {
            echo '## Combined synthetic Folego 360 verdict'
            echo "Flutter money/Premium/import integration: $FINANCE_RESULT"
            echo "Node browser Push unit contracts: $PUSH_RESULT"
            echo ''
            echo 'These are only synthetic contract tests. NOT production release approval:'
            echo '- Independent signed fictional A/B staging is not configured.'
            echo '- Real installed iPhone/APNs/browser logout requires physical testing.'
            echo '- Native purchase/refund/restore, all customer deletion and price'
            echo '  parity with actual Apple/Google store products are not verified.'
            echo '- No personal financial data is accessed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$FINANCE_RESULT" = success
          test "$PUSH_RESULT" = success
