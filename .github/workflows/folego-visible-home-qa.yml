name: Folego visible home QA

on:
  push:
    branches:
      - design/folego-flow-visible-home-20261106
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/folego-visible-home-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Daily-first dashboard and financial privacy regressions
        run: flutter test test/web2_responsive_shell_test.dart test/aurora_active_iphone_home_test.dart test/home_mobile_summary_strip_test.dart test/home_budget_overview_panel_test.dart test/folego4_home_visual_test.dart test/flow_native_navigation_test.dart -r expanded
      - name: Build release web
        run: flutter build web --release
