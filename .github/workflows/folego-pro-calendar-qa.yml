name: Folego Pro calendar QA

on:
  push:
    branches:
      - feat/folego-pro-financial-calendar-20261105
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/folego-pro-calendar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folego-calendar-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrow-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test compact calendar and month data isolation
        run: flutter test test/agenda_calendar_pro_test.dart test/agenda_monthly_view_wiring_test.dart -r expanded
