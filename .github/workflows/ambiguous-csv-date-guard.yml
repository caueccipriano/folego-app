name: Ambiguous CSV date guard

on:
  pull_request:
    paths:
      - 'folego_flutter/lib/features/transactions/statement_import_parser.dart'
      - 'folego_flutter/lib/features/transactions/statement_import_screen.dart'
      - 'folego_flutter/test/csv_ambiguous_date*'
      - '.github/workflows/ambiguous-csv-date-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-order-safety:
    name: Explicit date order, no silent wrong-month imports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: folego_flutter
        run: flutter pub get
      - name: Analyze date parsing, preview UI and full app
        working-directory: folego_flutter
        run: |
          dart analyze \
            lib/features/transactions/statement_import_parser.dart \
            lib/features/transactions/statement_import_screen.dart \
            test/csv_ambiguous_dates_test.dart \
            test/csv_ambiguous_date_ui_test.dart
          flutter analyze --no-pub
      - name: Test full-column preflight and existing import behavior
        working-directory: folego_flutter
        run: |
          flutter test \
            test/csv_ambiguous_dates_test.dart \
            test/csv_ambiguous_date_ui_test.dart \
            test/csv_card_sign_convention_test.dart \
            test/csv_card_sign_ui_test.dart \
            test/portable_csv_header_mapping_test.dart \
            test/statement_import_parser_test.dart \
            test/statement_import_ui_test.dart
      - name: Document limits of simulated verification
        run: |
          {
            echo 'Synthetic Flutter-only ambiguity and money tests:'
            echo 'no live customer records, third-party export, or Dev write.'
            echo 'Authenticated two-user staging still required.'
          } >> "$GITHUB_STEP_SUMMARY"
