name: Folego 6 themes and AI UX QA
on:
  push:
    branches:
      - design/folego-six-themes-ai-20261105
  pull_request:
    branches:
      - release/folego-flow-20261106
    paths:
      - 'folego_flutter/**'
      - 'supabase/functions/financial-ai/**'
      - 'supabase/tests/**'
      - '.github/workflows/folego-six-themes-ai-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: iPhone, themes and assistant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Theme, AI, responsive home and privacy regressions
        run: |
          flutter test \
            test/theme_palette_test.dart \
            test/theme_preference_test.dart \
            test/financial_ai_prompt_suggestions_test.dart \
            test/financial_ai2_contract_test.dart \
            test/financial_ai_fallback_contract_test.dart \
            test/home_mobile_summary_strip_test.dart \
            test/signature_feature_hero_six_themes_test.dart \
            test/folego3_more_tools_sheet_test.dart \
            test/folego4_plan_summary_visual_test.dart \
            test/aurora_active_iphone_home_test.dart \
            test/folego4_home_visual_test.dart \
            test/web2_responsive_shell_test.dart
      - name: Build web PWA without publishing
        run: flutter build web --release --base-href "/folego-app/"

  gemini:
    name: Verified AI safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Local financial fallback and Gemini adapter tests
        run: |
          deno test --no-check --allow-read=supabase/functions/financial-ai/index.ts \
            supabase/tests/gemini_adapter_test.ts \
            supabase/tests/financial_category_context_test.ts \
            supabase/tests/financial_ai_local_summary_test.ts
      - run: deno check supabase/functions/financial-ai/index.ts
