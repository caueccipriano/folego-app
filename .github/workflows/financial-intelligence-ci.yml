name: Financial intelligence checks

on:
  pull_request:
    paths:
      - 'folego_flutter/lib/core/intelligence/**'
      - 'folego_flutter/lib/widgets/**'
      - 'folego_flutter/lib/data/repositories/folego_repository_agenda.dart'
      - 'folego_flutter/lib/features/home/home_screen_base.dart'
      - 'folego_flutter/test/**'
      - 'folego_flutter/pubspec.yaml'
      - '.github/workflows/financial-intelligence-ci.yml'
  workflow_dispatch:

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib/core/intelligence lib/widgets/monthly_insights_card.dart lib/widgets/weekly_insights_card.dart lib/widgets/runway_what_if_card.dart lib/widgets/purchase_simulator_card.dart lib/widgets/purchase_timeline_card.dart lib/features/home/home_screen_base.dart test/purchase_timeline_test.dart test/purchase_simulator_safe_ui_test.dart test/financial_intelligence_test.dart test/financial_report_builder_test.dart test/weekly_report_builder_test.dart test/intelligence_plan_test.dart test/financial_explanation_test.dart test/cash_runway_test.dart test/cash_runway_scenario_test.dart test/cash_runway_preparation_test.dart test/runway_what_if_widget_test.dart test/financial_insights_agenda_integration_test.dart test/financial_ai_card_privacy_test.dart
      - run: flutter test test/purchase_timeline_test.dart test/purchase_simulator_safe_ui_test.dart test/financial_intelligence_test.dart test/financial_report_builder_test.dart test/weekly_report_builder_test.dart test/intelligence_plan_test.dart test/financial_explanation_test.dart test/cash_runway_test.dart test/cash_runway_scenario_test.dart test/cash_runway_preparation_test.dart test/runway_what_if_widget_test.dart test/financial_insights_agenda_integration_test.dart test/financial_ai_card_privacy_test.dart
