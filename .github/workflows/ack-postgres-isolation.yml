name: Folego ACK isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'qa/staging/ack-postgres-isolation.test.mjs'
      - 'supabase/migrations/20261014034000_sheet_delivery_ack_v1.sql'
      - 'supabase/migrations/20261014034200_sheet_delivery_ack_explicit_deny.sql'
      - '.github/workflows/ack-postgres-isolation.yml'
  workflow_dispatch:

jobs:
  real-postgres-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PostgreSQL client and isolated DB
        run: |
          psql -X -At -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int >= 170000" | grep -qx t
      - name: Execute actual Folego ACK RPCs with synthetic tenant identities
        run: node --test qa/staging/ack-postgres-isolation.test.mjs
