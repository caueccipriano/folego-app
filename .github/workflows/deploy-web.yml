name: Deploy retired Folego gateway

on:
  push:
    branches:
      - feat/transactions-recurring
    paths:
      - 'folego_flutter/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage retired gateway
        run: |
          rm -rf public-site
          mkdir -p public-site
          cp -R folego_flutter/web/. public-site/
          sed -i "s/__FOLEGO_BUILD_VERSION__/\${GITHUB_SHA}/g" public-site/index.html
          cp public-site/index.html public-site/404.html

      - name: Verify retired gateway
        run: |
          test -f public-site/index.html
          test -f public-site/manifest.json
          test -f public-site/flutter_service_worker.js
          grep -F 'FÔLEGO → EU CENTRAL' public-site/index.html
          grep -F 'https://caueccipriano.github.io/mylife-caue-app/#/dinheiro' public-site/index.html
          grep -F '<base href="/folego-app/">' public-site/index.html
          grep -F '"theme_color": "#3157D5"' public-site/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
