name: Deploy Flutter Web

on:
  push:
    branches:
      - feat/transactions-recurring
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate brand icons from canonical SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 512 -h 512 web/icons/folego-logo.svg -o web/icons/Icon-512.png
          rsvg-convert -w 512 -h 512 web/icons/folego-logo-maskable.svg -o web/icons/Icon-maskable-512.png
          rsvg-convert -w 192 -h 192 web/icons/folego-logo.svg -o web/icons/Icon-192.png
          rsvg-convert -w 192 -h 192 web/icons/folego-logo-maskable.svg -o web/icons/Icon-maskable-192.png
          rsvg-convert -w 180 -h 180 web/icons/folego-logo.svg -o web/icons/Icon-180.png
          rsvg-convert -w 64 -h 64 web/icons/folego-logo.svg -o web/favicon.png

      - name: Analyze
        run: flutter analyze

      - name: Build web app
        run: flutter build web --release --base-href "/folego-app/"

      - name: Version PWA cache and app shell
        run: |
          sed -i "s/__FOLEGO_CACHE_VERSION__/${GITHUB_SHA}/g" build/web/folego_push_sw.js
          sed -i "s/__FOLEGO_BUILD_VERSION__/${GITHUB_SHA}/g" build/web/index.html
          sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" build/web/flutter_bootstrap.js

      - name: Verify PWA artifact
        run: |
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/folego_push_sw.js
          test -f build/web/folego_push_bridge.js
          grep -F "${GITHUB_SHA}" build/web/folego_push_sw.js
          grep -F "${GITHUB_SHA}" build/web/index.html
          grep -F "main.dart.js?v=${GITHUB_SHA}" build/web/flutter_bootstrap.js
          ! grep -F "__FOLEGO_CACHE_VERSION__" build/web/folego_push_sw.js
          ! grep -F "__FOLEGO_BUILD_VERSION__" build/web/index.html
          grep -F 'href="/folego-app/"' build/web/index.html
          grep -F 'property="og:image"' build/web/index.html
          grep -F "${GITHUB_SHA}" build/web/index.html
          test -f build/web/icons/Icon-512.png
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-180.png
          grep -F '"display": "standalone"' build/web/manifest.json

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: folego_flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
