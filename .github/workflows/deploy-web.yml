name: Deploy Flutter Web

on:
  push:
    branches:
      - feat/transactions-recurring
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate brand icons from canonical SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 512 -h 512 web/icons/folego-logo.svg -o web/icons/Icon-512.png
          rsvg-convert -w 512 -h 512 web/icons/folego-logo-maskable.svg -o web/icons/Icon-maskable-512.png
          rsvg-convert -w 192 -h 192 web/icons/folego-logo.svg -o web/icons/Icon-192.png
          rsvg-convert -w 192 -h 192 web/icons/folego-logo-maskable.svg -o web/icons/Icon-maskable-192.png
          rsvg-convert -w 180 -h 180 web/icons/folego-logo.svg -o web/icons/Icon-180.png
          rsvg-convert -w 64 -h 64 web/icons/folego-logo.svg -o web/favicon.png

      - name: Analyze
        run: flutter analyze

      - name: Stable responsive preflight
        run: |
          flutter test \
            test/app_breakpoints_test.dart \
            test/auth_widgets_test.dart \
            test/auth_responsive_smoke_test.dart

      - name: Flutter public auth integration smoke
        run: |
          chromedriver --port=4444 >/tmp/chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid"' EXIT

          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/auth_public_flow_test.dart \
            -d web-server \
            --browser-name=chrome

      - name: Build web app
        run: flutter build web --release --base-href "/folego-app/"

      - name: Version PWA cache and app shell
        run: |
          sed -i "s/__FOLEGO_CACHE_VERSION__/${GITHUB_SHA}/g" build/web/folego_push_sw.js
          sed -i "s/__FOLEGO_BUILD_VERSION__/${GITHUB_SHA}/g" build/web/index.html
          sed -i "s#main.dart.js#main.dart.js?v=${GITHUB_SHA}#g" build/web/flutter_bootstrap.js

      - name: Verify PWA artifact
        run: |
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/folego_push_sw.js
          test -f build/web/folego_push_bridge.js
          grep -F "${GITHUB_SHA}" build/web/folego_push_sw.js
          grep -F "${GITHUB_SHA}" build/web/index.html
          grep -F "main.dart.js?v=${GITHUB_SHA}" build/web/flutter_bootstrap.js
          ! grep -F "__FOLEGO_CACHE_VERSION__" build/web/folego_push_sw.js
          ! grep -F "__FOLEGO_BUILD_VERSION__" build/web/index.html
          grep -F 'href="/folego-app/"' build/web/index.html
          grep -F 'property="og:image"' build/web/index.html
          grep -F "${GITHUB_SHA}" build/web/index.html
          test -f build/web/icons/Icon-512.png
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-180.png
          grep -F '"display": "standalone"' build/web/manifest.json

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Stage build for cross-device QA
        run: |
          rm -rf ../qa-site
          mkdir -p ../qa-site/folego-app
          cp -R build/web/. ../qa-site/folego-app/

      - name: Set up Node for browser QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright QA dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps chromium webkit

      - name: Run pre-deploy cross-device QA
        working-directory: qa
        env:
          QA_BASE_URL: http://127.0.0.1:4173/folego-app/
        run: |
          python3 -m http.server 4173 --directory ../qa-site >/tmp/folego-qa-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test tests/public-shell.spec.ts

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folego-predeploy-browser-qa-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            qa/playwright-report/
            qa/test-results/

      - name: Replace public shell with EU migration landing
        run: |
          cat > build/web/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#3157D5">
            <meta name="robots" content="noindex">
            <title>Fôlego agora está no EU</title>
            <style>
              :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#14182a;background:#f6f7fb}
              *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,rgba(49,87,213,.13),transparent 28rem),#f6f7fb}
              main{width:min(520px,100%);padding:30px;border:1px solid #e3e6ef;border-radius:30px;background:#fff;box-shadow:0 24px 70px rgba(20,24,42,.12)}
              .mark{width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#3157d5,#4265d6);color:#fff;font-weight:900;font-size:23px;box-shadow:0 12px 28px rgba(49,87,213,.22)}
              small{display:block;margin-top:22px;color:#3157d5;font-size:10px;font-weight:900;letter-spacing:.09em}
              h1{margin:8px 0 12px;font-size:42px;line-height:.96;letter-spacing:-.05em}p{margin:0;color:#687086;line-height:1.55;font-size:14px}
              a{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:24px;border-radius:17px;background:#3157d5;color:white;text-decoration:none;font-weight:900}
              .note{margin-top:16px;padding-top:16px;border-top:1px solid #e3e6ef;font-size:12px;color:#687086}
            </style>
            <meta http-equiv="refresh" content="4;url=https://caueccipriano.github.io/mylife-caue-app/#/dinheiro">
          </head>
          <body>
            <main>
              <div class="mark">EU</div>
              <small>FÔLEGO → EU CENTRAL</small>
              <h1>Seu dinheiro mudou de casa.</h1>
              <p>O FÔLEGO agora é o módulo <strong>Dinheiro</strong> dentro do EU. Seus dados, histórico e cálculos continuam no mesmo backend — só a experiência foi centralizada.</p>
              <a id="go" href="https://caueccipriano.github.io/mylife-caue-app/#/dinheiro">Abrir Dinheiro no EU</a>
              <p class="note">Estamos limpando o cache do app antigo para evitar que uma versão velha continue abrindo no seu iPhone.</p>
            </main>
            <script>
              const target='https://caueccipriano.github.io/mylife-caue-app/#/dinheiro';
              (async()=>{try{
                if('serviceWorker' in navigator){
                  const regs=await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(r=>r.unregister()));
                }
                if('caches' in window){
                  const keys=await caches.keys();
                  await Promise.all(keys.map(k=>caches.delete(k)));
                }
              }catch(e){}
              setTimeout(()=>location.replace(target),1400);
              })();
            </script>
          </body>
          </html>
          HTML
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: folego_flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
