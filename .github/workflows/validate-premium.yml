name: Validate Play Store Premium

on:
  push:
    branches:
      - playstore-premium
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/validate-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format validation copy
        run: >
          dart format
          lib/core/subscriptions
          lib/main.dart
          lib/features/auth/auth_gate.dart
          lib/features/profile/profile_screen.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
