name: iPhone WebKit Push gesture safety

on:
  pull_request:
    paths:
      - 'folego_flutter/web/folego_push_bridge.js'
      - 'folego_flutter/web/tests/folego_push_recovery_bridge.test.cjs'
      - 'folego_flutter/lib/core/notifications/**'
      - 'folego_flutter/test/ios_push_gesture_contract_test.dart'
      - 'qa/tests/ios-push-gesture.spec.ts'
      - '.github/workflows/ios-push-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-gesture:
    name: iPhone-sized real WebKit engine / synthetic Push API
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # The test uses page.setContent and wholly synthetic browser APIs.
      # Defining QA_BASE_URL intentionally disables the unrelated PWA server.
      QA_BASE_URL: 'http://127.0.0.1:4173/'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: qa
        run: npm install --no-audit --no-fund
      - name: Install WebKit and its Linux dependencies
        working-directory: qa
        run: npx playwright install --with-deps webkit
      - name: Run genuine WebKit engine with synthetic iPhone-sized browser APIs
        working-directory: qa
        run: |
          npx playwright test tests/ios-push-gesture.spec.ts \
            --project=iphone-15-pro \
            --project=iphone-compact
      - name: State physical-device testing limitation
        if: always()
        run: |
          {
            echo 'WebKit engine used a simulated installed iPhone PWA and fake'
            echo 'PushManager/Notification APIs. This does NOT prove physical'
            echo 'iPhone Safari OS permission dialogs or real APNs delivery.'
          } >> "$GITHUB_STEP_SUMMARY"
