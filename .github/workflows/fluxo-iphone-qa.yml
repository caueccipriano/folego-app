name: QA visual iPhone - Fluxo

on:
  push:
    branches:
      - feat/budget-flow-inspired-ui-20261105
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/fluxo-iphone-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxo-iphone-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-home-iphone:
    name: Real Flutter Home at iPhone widths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: folego_flutter
        run: flutter pub get
      - name: Render actual compact Home with synthetic data
        working-directory: folego_flutter
        env:
          FOLEGO_VISUAL_CAPTURE: '1'
        run: |
          flutter test --update-goldens \
            test/web2_responsive_shell_test.dart \
            --plain-name 'Fluxo iPhone visual preview'
      - name: Upload light/dark iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxo-iphone-screens-${{ github.run_number }}
          path: folego_flutter/test/goldens/fluxo-home-*.png
          if-no-files-found: warn
          retention-days: 7
