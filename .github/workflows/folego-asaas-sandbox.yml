name: Folego Asaas Sandbox Policy
on:
  pull_request:
    paths:
      - 'ops/asaas-folego/**'
      - 'qa/asaas/**'
      - 'supabase/functions/folego-asaas-*/**'
      - '.github/workflows/folego-asaas-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-payment-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run sandbox-only payment policy tests
        run: node --test ops/asaas-folego/*.test.mjs qa/asaas/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sandbox Edge Functions without deploying
        run: |
          deno check supabase/functions/folego-asaas-checkout-sandbox/index.ts
          deno check supabase/functions/folego-asaas-webhook-sandbox/index.ts
      - name: Explicit release lock
        run: |
          echo 'Sandbox policy unit tests only.'
          echo 'No Asaas API calls, no Supabase deployment, no customer charges.'
