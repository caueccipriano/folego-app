name: Folego Flow compact overview QA

on:
  push:
    branches:
      - design/folego-flow-compact-overview-20261105
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/folego-flow-compact-qa.yml'
  pull_request:
    branches:
      - feat/folego-pro-financial-calendar-20261105
    paths:
      - 'folego_flutter/**'
      - '.github/workflows/folego-flow-compact-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-compact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: folego_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Compact overview, privacy and account separation
        run: flutter test test/home_overview_modules_settings_test.dart test/home_budget_overview_panel_test.dart -r expanded
      - name: Build PWA
        run: flutter build web --release
