name: CSV unambiguous dates and review safety

on:
  pull_request:
    paths:
      - 'folego_flutter/lib/features/transactions/statement_import_parser.dart'
      - 'folego_flutter/lib/features/transactions/statement_import_screen.dart'
      - 'folego_flutter/test/csv_ambiguous_date_safety_test.dart'
      - 'folego_flutter/test/csv_ambiguous_date_widget_test.dart'
      - '.github/workflows/csv-ambiguous-date-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-csv-date-choice:
    name: No silent day/month swaps on imported financial events
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: folego_flutter
        run: flutter pub get
      - name: Analyze CSV date guard and the full Flutter app
        working-directory: folego_flutter
        run: |
          dart analyze \
            lib/features/transactions/statement_import_parser.dart \
            lib/features/transactions/statement_import_screen.dart \
            test/csv_ambiguous_date_safety_test.dart \
            test/csv_ambiguous_date_widget_test.dart
          flutter analyze --no-pub
      - name: Preserve all earlier card/CSV migration behavior
        working-directory: folego_flutter
        run: |
          flutter test \
            test/csv_ambiguous_date_safety_test.dart \
            test/csv_ambiguous_date_widget_test.dart \
            test/csv_card_sign_convention_test.dart \
            test/csv_card_sign_ui_test.dart \
            test/portable_csv_header_mapping_test.dart \
            test/statement_import_parser_test.dart \
            test/statement_import_qa_synthetic_test.dart \
            test/statement_import_ui_test.dart \
            test/statement_import_contract_test.dart
      - name: State verification boundaries
        run: |
          {
            echo 'Synthetic parser and Flutter import tests only.'
            echo 'No real bank/app statements, no financial-space staging,'
            echo 'no migrations and no customer transaction mutations.'
          } >> "$GITHUB_STEP_SUMMARY"
