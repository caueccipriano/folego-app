name: folego
description: Fôlego — quanto você realmente pode gastar hoje sem apertar amanhã.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  supabase_flutter: ^2.17.2
  google_fonts: ^8.2.1
  tabler_icons_plus: ^3.46.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  package_info_plus: ^8.3.1
  share_plus: ^11.1.0
  file_picker: ^10.0.0
  crypto: ^3.0.0
  purchases_flutter: ^10.10.0
  purchases_ui_flutter: ^10.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - web/icons/Icon-512.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/icons/Icon-512.png"
  remove_alpha_ios: true
