<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Fôlego — entenda quanto do seu dinheiro está realmente livre hoje, sem apertar amanhã.">
  <meta name="format-detection" content="telephone=no">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EE">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fôlego">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Fôlego</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light dark;
      --folego-web-bg: #F7F4EE;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --folego-web-bg: #101014;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: var(--folego-web-bg);
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    flutter-view {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: var(--folego-web-bg) !important;
    }
  </style>
</head>
<body>
  <script src="folego_ios_zoom_fix.js"></script>
  <script src="folego_push_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
