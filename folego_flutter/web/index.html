<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Fôlego — entenda quanto do seu dinheiro está realmente livre hoje, sem apertar amanhã.">
  <meta name="format-detection" content="telephone=no">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EE">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fôlego">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Fôlego</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light dark;
      --folego-web-bg: #F7F4EE;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --folego-web-bg: #101014;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--folego-web-bg);
    }

    /*
     * Do not size or position flutter-view here.
     * Flutter's web engine owns that geometry. Forcing 100dvh/fixed sizing on
     * iOS PWAs can desync the visual viewport from Flutter pointer hit-testing
     * after viewport/safe-area changes.
     */
    flutter-view {
      background-color: var(--folego-web-bg) !important;
    }
  </style>
</head>
<body>
  <script>
    (() => {
      // One-time repair for users who opened builds controlled by the old
      // cache-first PWA worker. The old worker could keep main.dart.js from a
      // broken build even after GitHub Pages had deployed a fixed version.
      const repairVersion = 'ios-pwa-geometry-20260919-v2';
      const repairKey = 'folego-pwa-repair-version';

      let alreadyRepaired = false;
      try {
        alreadyRepaired = localStorage.getItem(repairKey) === repairVersion;
        if (!alreadyRepaired) localStorage.setItem(repairKey, repairVersion);
      } catch (_) {
        // Storage can be unavailable in hardened/private browser contexts.
      }

      if (alreadyRepaired || !('serviceWorker' in navigator)) return;

      const hadController = navigator.serviceWorker.controller != null;
      const appScope = new URL('./', document.baseURI).href;

      Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(
            registrations
              .filter((registration) => registration.scope.startsWith(appScope))
              .map((registration) => registration.unregister()),
          ),
        ),
        'caches' in window
          ? caches.keys().then((names) =>
              Promise.all(
                names
                  .filter((name) => name.startsWith('folego-shell-'))
                  .map((name) => caches.delete(name)),
              ),
            )
          : Promise.resolve(),
      ])
        .then(() => {
          // A page stays under its current controller until navigation. Reload
          // once after unregistering so Flutter boots from the network.
          if (hadController) window.location.reload();
        })
        .catch(() => {
          // Cache repair must never prevent the app from starting.
        });
    })();
  </script>
  <script src="folego_ios_zoom_fix.js"></script>
  <script src="folego_push_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
