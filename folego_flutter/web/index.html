<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Fôlego — entenda quanto do seu dinheiro está realmente livre hoje, sem apertar amanhã.">
  <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fôlego">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fôlego</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #F5F1E8;
      color-scheme: light dark;
      overscroll-behavior: none;
    }

    body,
    flutter-view {
      background-color: #F5F1E8 !important;
    }

    /*
     * Keep Flutter's layout viewport and pointer hit-test viewport identical.
     * Forcing a fixed 100dvh canvas on installed iOS PWAs can visually move
     * content without moving Flutter's logical hit-test coordinates.
     */
    flutter-view {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
    }

    @media (prefers-color-scheme: dark) {
      html,
      body,
      flutter-view {
        background-color: #101014 !important;
      }
    }
  </style>
</head>
<body>
  <script src="folego_ios_zoom_fix.js"></script>
  <script src="folego_push_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
